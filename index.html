<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wadora Restaurant Menü</title>
  <meta name="description" content="Wadora Restaurant menüsü — dürüm, double dürüm, karışık dürüm ve karışık servis çeşitleri." />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <meta property="og:title" content="Wadora Restaurant Menü" />
  <meta property="og:description" content="Dürüm, double dürüm, karışık dürüm ve karışık servis çeşitleri." />
  <meta property="og:image" content="images/banner.webp" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <a class="skip-link" href="#menu">Menüye geç</a>

  <!-- Banner: the sign photo already carries the name/branding, so we don't repeat it visually -->
  <header class="banner">
    <h1 class="sr-only">Wadora Restaurant</h1>
    <div class="banner-overlay">
      <p>Izgara üzerine, günlük taze hazırlanan dürüm ve şiş çeşitleri</p>
    </div>
  </header>

  <!-- Sticky search + category nav -->
  <div class="menu-toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="search" id="search-input" placeholder="Menüde ara… (ör. adana, döner)" aria-label="Menüde ara" />
    </div>

    <nav class="menu-nav" id="menu-nav" aria-label="Kategoriler">
      <a href="#durum" data-target="durum">Dürüm</a>
      <a href="#double" data-target="double">Double</a>
      <a href="#karisik" data-target="karisik">Karışık</a>
      <a href="#kampanyalar" data-target="kampanyalar">Karışık Servis</a>
    </nav>
  </div>

  <!-- Menu will be injected here by JS -->
  <main id="menu"></main>

  <p class="no-results" id="no-results" hidden>Aramanızla eşleşen bir ürün bulunamadı.</p>

  <!-- Item detail modal -->
  <div class="item-modal" id="item-modal" hidden>
    <div class="item-modal-backdrop" data-close></div>
    <div class="item-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="item-modal-close" data-close aria-label="Kapat">&times;</button>
      <div class="item-modal-image" id="modal-image"></div>
      <h3 id="modal-title"></h3>
      <div class="item-modal-price" id="modal-price"></div>
    </div>
  </div>

  <!-- Floating actions -->
  <a class="fab fab-call" href="tel:+905338551444" aria-label="Sipariş için ara">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1l-2.5 2.9z"/>
    </svg>
  </a>
  <button class="fab fab-top" id="scroll-top" aria-label="Başa dön" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <footer class="footer">
    <div class="footer-image">
      <img src="images/restaurant-full.webp" alt="Wadora Restaurant" loading="lazy" decoding="async" />
    </div>

    <a class="footer-phone" href="tel:+905338551444">
      📞 0 533 855 14 44
    </a>

    <div class="footer-info">
      <p>© 2026 Wadora Restaurant</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
